[project]
name = "soviar-toolkit"
version = "0.1.0"
description = "Toolkit of an AI-native team: agent configuration, skills and CLI utilities"
readme = "README.md"
authors = [
    { name = "Vadim Rudakov", email = "lefthand67@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
